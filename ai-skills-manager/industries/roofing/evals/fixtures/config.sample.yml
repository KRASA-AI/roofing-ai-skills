# Roofing eval fixture — sample config.yml
#
# WHY THIS EXISTS
# Five consecutive eval cycles (05-25 through 07-06) named the same blocker: personalization
# is capped at 8 across most of the library not because the skills bind config poorly, but
# because no config fixture is committed, so personalization can only be graded on how
# gracefully a skill handles an ABSENT config (ceiling 8) rather than on live field binding
# (9-10). This fixture removes that cap.
#
# HOW TO USE IT (starting with the 2026-07-20 cycle)
# Grade personalization by resolving each named field a skill references against this file:
#   9-10  every field the skill names resolves here, is used in the right place, and the
#         skill still degrades gracefully when an optional field is absent
#   7-8   fields named and bound, but some are invented (not in this fixture) or unused
#   4-6   config referenced only generically
# Fields deliberately LEFT OUT below (marked ABSENT-BY-DESIGN) test graceful degradation —
# a skill that fabricates a value for one of these instead of flagging it in its Assumptions
# footer should be marked down.
#
# This is a fixture, not a real business. Values are representative of a mid-size
# North-Texas residential-plus-light-commercial shop.


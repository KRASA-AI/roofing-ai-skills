  runs to roughly 160+ characters -- both mislabeled and brushing past the skill's own "SMS: under 160
  characters" guideline in Message guidelines. Financing figures are off by ~$1 on rounding ($759 stated vs
  $758.33 actual for $18,200/24mo; $216 stated vs $217.4 actual at 9.99% APR/144mo) -- trivial in isolation but
  adds to the pattern of unverified figures in a customer-facing document. output_quality drops 8->7 on the
  accumulation of a substantive date error plus a second, independently-found numeric mislabel.
  personalization holds at 6: the "Resolved config fields" block still presents financing.partners[],
  reviews.count_last_90_days=142/average_rating=4.9, seasonal_hooks.*, team.rep_roster[], service_area.
